services:
  object-store:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: server -s3 -dir=/data -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-surveillance-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-surveillance-local-secret}
    ports:
      - "8333:8333"
      - "8888:8888"
    volumes:
      - object_store_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow-local-only}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Data Warehouse (star schema for BI). Separate from Airflow's metadata DB.
  warehouse-db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${WAREHOUSE_DB_USER:-dw_user}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-warehouse-local-only}
      POSTGRES_DB: ${WAREHOUSE_DB_NAME:-surveillance_dw}
    ports:
      # Power BI on the host connects to localhost:5433 (loopback only).
      - "127.0.0.1:5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Web dashboard reading the warehouse live: http://localhost:8501
  dashboard:
    build: ./dashboard
    depends_on:
      warehouse-db:
        condition: service_healthy
    environment:
      WAREHOUSE_DB_HOST: warehouse-db
      WAREHOUSE_DB_PORT: "5432"
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-surveillance_dw}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-dw_user}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-warehouse-local-only}
    ports:
      - "127.0.0.1:8501:8000"
    restart: unless-stopped

  airflow:
    build: ./airflow
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_started
      warehouse-db:
        condition: service_healthy
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow-local-only}@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-local-development-secret-key}
      # `standalone` ignores _AIRFLOW_WWW_USER_*; the image entrypoint creates
      # this login (idempotently) only when these two flags are set.
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow-local-only}
      # Keep the UI alive while Spark saturates the container: fewer gunicorn
      # workers, longer startup timeout, and Spark capped at 2 cores.
      AIRFLOW__WEBSERVER__WORKERS: "2"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      # A long Spark task under load must not be declared a zombie and killed.
      AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD: "900"
      SPARK_MASTER: ${SPARK_MASTER:-local[2]}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
      S3_ENDPOINT: http://object-store:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-surveillance-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-surveillance-local-secret}
      DATA_LAKE_BUCKET: ${DATA_LAKE_BUCKET:-disease-surveillance}
      # Spark reads raw/ and writes processed/ on the lake. Set to empty for local-file mode.
      DATA_LAKE_URI: ${DATA_LAKE_URI-s3a://${DATA_LAKE_BUCKET:-disease-surveillance}}
      RAW_DATA_DIR: /opt/airflow/project/data/raw
      REQUIRE_POPULATION: ${REQUIRE_POPULATION:-false}
      WAREHOUSE_DB_HOST: warehouse-db
      WAREHOUSE_DB_PORT: "5432"
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-surveillance_dw}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER:-dw_user}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-warehouse-local-only}
      PYTHONPATH: /opt/airflow/project
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./data/raw:/opt/airflow/project/data/raw:ro
      - ./data/processed:/opt/airflow/project/data/processed
      - ./spark:/opt/airflow/project/spark:ro
      - ./sql:/opt/airflow/project/sql:ro
      - ./tests:/opt/airflow/project/tests:ro
      - ./pytest.ini:/opt/airflow/project/pytest.ini:ro
      - airflow_logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

volumes:
  object_store_data:
  postgres_data:
  warehouse_data:
  airflow_logs:
