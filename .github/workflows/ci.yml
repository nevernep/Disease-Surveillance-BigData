name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Spark, warehouse, extract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PySpark 3.5 needs a Java 17 runtime.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python sources
        run: python -m compileall -q spark src dashboard powerbi tests airflow/dags

      # DAG tests skip themselves here (no Airflow); they run in the next job.
      - name: Run tests
        run: python -m pytest -q

  dag-tests:
    name: Airflow DAG tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AIRFLOW_VERSION: "2.10.5"
      PYTHON_VERSION: "3.12"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Same Airflow as the Docker image, installed with its official constraints.
      - name: Install Airflow
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" boto3 pytest python-dotenv requests \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"

      - name: Run DAG tests
        run: python -m pytest -q tests/test_dags.py

  compose:
    name: Docker Compose file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
